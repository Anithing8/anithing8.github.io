<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Doc Toolkit</title>
  
  <!-- External Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.9/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script> <!-- Replaced emojis with Lucide Icons -->
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { brand: '#4f46e5' }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen pb-28 font-sans antialiased transition-colors duration-300 relative overflow-x-hidden">

  <!-- Dynamic Liquid Background -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Floating Header -->
  <div class="max-w-md mx-auto pt-4 px-4 sticky top-0 z-30">
    <header class="glass-panel rounded-2xl px-4 py-3 flex items-center justify-between shadow-lg shadow-black/5 dark:shadow-black/20">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md">
          <i data-lucide="zap" class="w-5 h-5"></i>
        </div>
        <h1 class="text-base font-bold tracking-tight">Doc Toolkit</h1>
      </div>
      <button id="themeToggle" class="p-2 rounded-xl glass-input text-gray-700 dark:text-slate-300 text-xs font-medium hover:scale-105 transition-transform flex items-center gap-2">
        <i data-lucide="sun" class="w-4 h-4" id="themeIcon"></i>
        <span id="themeText">Light</span>
      </button>
    </header>
  </div>

  <!-- Main View Area -->
  <main class="max-w-md mx-auto p-4 mt-2">

    <!-- Dashboard (Grid View) -->
    <section id="dashboardView">
      <div class="mb-6 relative">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 w-5 h-5"></i>
        <input type="text" id="toolSearch" placeholder="Search all tools..." class="w-full text-sm py-3.5 pl-10 pr-4 rounded-xl glass-input focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder-gray-500 dark:placeholder-gray-400" />
      </div>

      <div class="mb-4 flex items-center justify-between px-1">
        <h2 id="tabHeading" class="text-lg font-bold tracking-tight">Identity Tools</h2>
        <span id="toolCount" class="text-xs px-2.5 py-1 rounded-full glass-panel font-medium">--</span>
      </div>

      <div id="toolsGrid" class="grid grid-cols-1 gap-3"></div>
    </section>

    <!-- Tool Workspace (Action View) -->
    <section id="workspaceView" class="hidden">
      <button id="backBtn" class="mb-4 inline-flex items-center text-sm font-semibold text-indigo-600 dark:text-indigo-400 hover:opacity-80 transition-opacity px-1 gap-1">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to toolkit
      </button>

      <div class="glass-panel rounded-3xl p-5 shadow-xl shadow-black/5 dark:shadow-black/20">
        <div class="flex items-center space-x-3 mb-2">
          <div id="toolIconContainer" class="text-indigo-500 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 p-2 rounded-lg">
            <!-- Icon injected via JS -->
          </div>
          <div>
            <h3 id="toolTitle" class="text-lg font-bold leading-tight">Loading...</h3>
            <p id="toolDesc" class="text-xs text-gray-600 dark:text-slate-400 mt-0.5">Please wait</p>
          </div>
        </div>

        <!-- Forms get injected here -->
        <div id="toolFormContainer" class="space-y-4 mt-5 pt-4 border-t border-gray-200/30 dark:border-slate-700/50"></div>

        <!-- Results Output Area -->
        <div id="outputArea" class="mt-5 pt-5 border-t border-gray-200/30 dark:border-slate-700/50 hidden text-center">
          <p class="text-sm font-semibold text-emerald-600 dark:text-emerald-400 mb-3 flex items-center justify-center gap-1">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i> Processing Complete
          </p>
          <div id="previewContainer" class="max-h-64 overflow-hidden rounded-xl flex items-center justify-center glass-input p-2 mb-4"></div>
          <a id="downloadBtn" href="#" download="processed_file" class="w-full inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-500/30 transition-all hover:-translate-y-0.5">
            <i data-lucide="download" class="w-4 h-4"></i> Download File
          </a>
        </div>
      </div>
    </section>

  </main>

  <!-- Floating Bottom Navigation -->
  <div class="fixed bottom-6 left-4 right-4 z-30 max-w-sm mx-auto">
    <nav class="glass-panel rounded-full px-2 py-2 flex justify-around shadow-2xl shadow-black/10 dark:shadow-black/40 border border-white/40 dark:border-white/10">
      <button data-tab="identity" class="nav-btn w-20 py-2 flex flex-col items-center justify-center rounded-full transition-all text-indigo-600 dark:text-indigo-400 bg-white/30 dark:bg-black/20 shadow-sm gap-1">
        <i data-lucide="contact" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold tracking-wide">Identity</span>
      </button>
      <button data-tab="images" class="nav-btn w-20 py-2 flex flex-col items-center justify-center rounded-full transition-all text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white gap-1">
        <i data-lucide="image" class="w-5 h-5 opacity-80"></i>
        <span class="text-[10px] font-medium tracking-wide">Images</span>
      </button>
      <button data-tab="pdfs" class="nav-btn w-20 py-2 flex flex-col items-center justify-center rounded-full transition-all text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white gap-1">
        <i data-lucide="file-text" class="w-5 h-5 opacity-80"></i>
        <span class="text-[10px] font-medium tracking-wide">PDFs</span>
      </button>
    </nav>
  </div>

  <!-- Main Application Logic -->
  <script src="script.js"></script>
</body>
</html>
