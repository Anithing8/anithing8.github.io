<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Doc Toolkit</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { brand: '#4f46e5' }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen pb-28 font-sans antialiased transition-colors duration-300 relative overflow-x-hidden">

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="max-w-5xl mx-auto pt-4 px-4 sticky top-0 z-30">
    <header class="bg-white dark:bg-slate-900 rounded-2xl px-4 py-3 flex items-center justify-between shadow-lg shadow-black/5 dark:shadow-black/20 border border-gray-200 dark:border-slate-800">
      <div class="flex items-center space-x-3">
        <img src="logo.png" alt="Website Logo" class="w-10 h-10 object-contain drop-shadow-sm" />
        <h1 class="text-base font-bold tracking-tight">Doc Toolkit</h1>
      </div>
      <button id="themeToggle" class="p-2 rounded-xl bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-slate-300 text-xs font-medium hover:scale-105 transition-transform flex items-center gap-1 border border-gray-200 dark:border-slate-700">
        <i class="ph-fill ph-sun text-sm" id="themeIcon"></i>
        <span id="themeText">Light</span>
      </button>
    </header>
  </div>

  <main class="max-w-5xl mx-auto p-4 mt-2">
    <section id="dashboardView">
      <div class="mb-6 relative max-w-2xl mx-auto">
        <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-lg"></i>
        <input type="text" id="toolSearch" placeholder="Search all tools..." class="w-full text-sm py-3.5 pl-10 pr-4 rounded-xl glass-input focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-white" />
      </div>

      <div class="mb-4 flex items-center justify-between px-1">
        <h2 id="tabHeading" class="text-xl font-bold tracking-tight">Identity Tools</h2>
        <span id="toolCount" class="text-xs px-2.5 py-1 rounded-full glass-panel font-medium">5 Tools</span>
      </div>

      <div id="toolsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <section id="workspaceView" class="hidden">
      <button id="backBtn" class="mb-4 inline-flex items-center gap-1 text-sm font-semibold text-indigo-600 dark:text-indigo-400 hover:opacity-80 transition-opacity px-1">
        <i class="ph ph-arrow-left"></i> Back to toolkit
      </button>

      <div class="max-w-2xl mx-auto glass-panel rounded-3xl p-5 shadow-xl shadow-black/5 dark:shadow-black/20">
        <div class="flex items-center space-x-3 mb-2">
          <span id="toolIcon" class="text-3xl drop-shadow-sm text-indigo-500"></span>
          <div>
            <h3 id="toolTitle" class="text-lg font-bold leading-tight">Tool Title</h3>
            <p id="toolDesc" class="text-xs text-gray-600 dark:text-slate-400 mt-0.5">Description</p>
          </div>
        </div>

        <div id="toolFormContainer" class="space-y-4 mt-5 pt-4 border-t border-gray-200/30 dark:border-slate-700/50"></div>

        <div id="outputArea" class="mt-5 pt-5 border-t border-gray-200/30 dark:border-slate-700/50 hidden text-center">
          <p class="text-sm font-semibold text-emerald-600 dark:text-emerald-400 mb-3 flex items-center justify-center gap-1">
            <i class="ph-bold ph-check-circle"></i> Processing Complete
          </p>
          <div id="previewContainer" class="max-h-64 overflow-hidden rounded-xl flex items-center justify-center glass-input p-2 mb-4"></div>
          <a id="downloadBtn" href="#" download="processed_file" class="w-full inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-500/30 transition-all hover:-translate-y-0.5">
            Download File
          </a>
        </div>
      </div>
    </section>
  </main>

  <div class="fixed bottom-6 left-0 right-0 z-30 flex justify-center pointer-events-none">
    <nav class="pointer-events-auto bg-white dark:bg-slate-950 rounded-full px-3 py-2 flex justify-center gap-2 shadow-2xl shadow-black/10 dark:shadow-black/40 border border-gray-200 dark:border-slate-800">
      <button id="tab-identity" class="nav-btn w-24 py-2 flex flex-col items-center justify-center rounded-full transition-all text-indigo-600 dark:text-indigo-400 bg-gray-100 dark:bg-slate-900 shadow-sm">
        <i class="ph ph-identification-card text-2xl mb-0.5 drop-shadow-sm"></i>
        <span class="text-[10px] font-semibold tracking-wide">Identity</span>
      </button>
      <button id="tab-images" class="nav-btn w-24 py-2 flex flex-col items-center justify-center rounded-full transition-all text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white">
        <i class="ph ph-image text-2xl mb-0.5 opacity-80"></i>
        <span class="text-[10px] font-medium tracking-wide">Images</span>
      </button>
      <button id="tab-pdfs" class="nav-btn w-24 py-2 flex flex-col items-center justify-center rounded-full transition-all text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white">
        <i class="ph ph-file-pdf text-2xl mb-0.5 opacity-80"></i>
        <span class="text-[10px] font-medium tracking-wide">PDFs</span>
      </button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
